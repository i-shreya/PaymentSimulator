services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: payment_simulator
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d payment_simulator"]
      interval: 5s
      timeout: 3s
      retries: 10

  payment-service:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/payment_simulator
      DB_USERNAME: payment
      DB_PASSWORD: payment
      JWT_SECRET: replace-with-at-least-32-random-characters
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - payment-service
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:5173"
